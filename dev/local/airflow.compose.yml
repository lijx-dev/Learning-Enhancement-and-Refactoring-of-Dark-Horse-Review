name: hmdp-airflow
services:
  scheduler:
    image: apache/airflow:2.11.0-python3.11
    user: '50000:0'
    mem_limit: 1536m
    cpus: 1
    environment: &airflow-env
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__CORE__DAGS_FOLDER: /workspace/data-platform/orchestration/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Shanghai
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '10'
      AIRFLOW__CORE__PARALLELISM: '1'
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__CORE__STORE_DAG_CODE: 'false'
    volumes:
      - ../..:/workspace
      - ../../target/airflow-state:/opt/airflow/state
    command: [bash, -c, 'airflow db migrate && exec airflow scheduler']
    healthcheck:
      test: [CMD, airflow, jobs, check, --job-type, SchedulerJob, --local]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
