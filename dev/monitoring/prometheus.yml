global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: hmdp
    metrics_path: /actuator/prometheus
    bearer_token_file: /tmp/monitor-token
    static_configs:
      - targets: ['java:8081']
  - job_name: canal
    metrics_path: /metrics
    static_configs:
      - targets: ['canal:11112']
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
