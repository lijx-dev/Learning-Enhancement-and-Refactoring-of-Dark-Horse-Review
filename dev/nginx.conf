server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Keep original deep links while rendering the new desktop application.
    location ~ ^/(index|shop-list|shop-detail|blog-detail|blog-edit|login|login2|info|other-info|orders|vouchers|experience)\.html$ {
        try_files $uri /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /imgs/ {
        alias /usr/share/nginx/hmdp-images/;
        error_page 404 = /assets/image-placeholder.svg;
    }

    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/ {
        set $api_backend java:8081;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
