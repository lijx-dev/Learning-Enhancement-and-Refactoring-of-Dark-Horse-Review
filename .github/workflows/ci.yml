name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check-repository.py
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend test
      - run: docker compose -f dev/docker-compose.yml config --quiet
      - run: docker compose -f dev/docker-compose.test.yml config --quiet
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Checkstyle, focused tests and package
        run: mvn -B -Dtest=MapperArchitectureTest,CacheReadTraceTest,RequestCacheScopeTest,CanalBatchTest,CacheChangeProjectorTest,SeckillMessageTest,ExperienceServiceTest package
